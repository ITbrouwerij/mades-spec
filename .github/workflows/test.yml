name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Node ${{ matrix.node-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Latest LTS versions only — Node 24 is current LTS (April 2026),
        # 22 is previous LTS, 20 is in maintenance. Node 18 is EOL.
        node-version: [20, 22, 24]
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run tests
        # `npm test`, so the set of tests is defined in ONE place. This step
        # used to name a test file directly, and when that file was renamed the
        # workflow kept pointing at it — nine green-looking jobs turned into
        # nine failures that said nothing about the code.
        #
        # The script itself still names an explicit file rather than a
        # directory: Node's `--test <dir>` behaviour varies between versions and
        # platforms, and on Node 23 it resolves the directory as a module and
        # fails outright.
        run: npm test
